name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green Test run beside
  # a release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at fifteen has hung rather than failed.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Run tests
        run: |
          set -eu
          scratch=$(mktemp -d)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          image="python:$(cat .python-version)"
          docker run --rm -i --platform linux/amd64 --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --cpus 4 --memory 4g --pids-limit 512 \
            --mount "type=bind,src=$PWD,dst=/project,readonly" \
            --mount "type=bind,src=$scratch,dst=/scratch" \
            -e SOURCE_DATE_EPOCH \
            -e HOME=/scratch/home -e TMPDIR=/scratch/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPYCACHEPREFIX=/scratch/pycache \
            "$image" sh -se <<'CONTAINER'
          mkdir -p /scratch/home /scratch/tmp /scratch/work
          test "$(uname -m)" = x86_64
          mkdir -p /scratch/work/tests/container
          cp /project/ai-maintainer /project/test_ai_maintainer.py /project/requirements-dev.txt /scratch/work/
          cp /project/tests/container/run /project/tests/container/test_exports.py /scratch/work/tests/container/
          cd /scratch/work
          python -m venv /scratch/venv
          . /scratch/venv/bin/activate
          python --version
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -v -p no:cacheprovider --basetemp=/scratch/pytest
          CONTAINER

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      - name: Run native lint
        run: |
          set -eu
          scratch=$(mktemp -d)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          image="python:$(cat .python-version)"
          docker run --rm -i --platform linux/amd64 --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --cpus 4 --memory 4g --pids-limit 512 \
            --mount "type=bind,src=$PWD,dst=/project,readonly" \
            --mount "type=bind,src=$scratch,dst=/scratch" \
            -e SOURCE_DATE_EPOCH \
            -e HOME=/scratch/home -e TMPDIR=/scratch/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPYCACHEPREFIX=/scratch/pycache \
            -e RUFF_CACHE_DIR=/scratch/ruff \
            "$image" sh -se <<'CONTAINER'
          mkdir -p /scratch/home /scratch/tmp
          cd /project
          python -m venv /scratch/venv
          . /scratch/venv/bin/activate
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          ruff check .
          ruff format --check .
          CONTAINER

      - name: Lint Markdown
        run: |
          set -eu
          scratch=$(mktemp -d)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          image="node:24.22.2"
          docker run --rm -i --platform linux/amd64 --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --cpus 4 --memory 4g --pids-limit 512 \
            --mount "type=bind,src=$PWD,dst=/project,readonly" \
            --mount "type=bind,src=$scratch,dst=/scratch" \
            -e SOURCE_DATE_EPOCH \
            -e HOME=/scratch/home -e TMPDIR=/scratch/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPYCACHEPREFIX=/scratch/pycache \
            -e RUFF_CACHE_DIR=/scratch/ruff \
            "$image" sh -se <<'CONTAINER'
          mkdir -p /scratch/home /scratch/tmp
          cd /project
          mkdir -p /scratch/tools
          cp /project/tests/container/package.json /project/tests/container/package-lock.json /scratch/tools/
          cd /scratch/tools
          npm ci --ignore-scripts --no-audit --no-fund
          cd /project
          node /scratch/tools/node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs
          CONTAINER

      - name: Lint shell scripts
        run: |
          set -eu
          scratch=$(mktemp -d)
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          docker run --rm --platform linux/amd64 --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --cpus 4 --memory 4g --pids-limit 512 \
            --mount "type=bind,src=$PWD,dst=/project,readonly" \
            --mount "type=bind,src=$scratch,dst=/scratch" \
            -e SOURCE_DATE_EPOCH \
            --workdir /project koalaman/shellcheck:v0.11.0 \
            -x -P SCRIPTDIR tests/container/run tests/container/check tests/container/stock tests/container/check-stock tests/container/python tests/container/markdown scripts/test-in-container
