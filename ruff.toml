# Matches ansible-ctrl, keylight and splinter-keyboard, the other repositories
# linted with ruff here. The sources were written wider than ruff's 88-column
# default, and reflowing them buys nothing.
line-length = 120

# The CLI itself carries no .py extension, and ruff finds files by extension.
# Named here rather than on the command line, so `ruff check .` covers the same
# files locally as the gate does.
extend-include = ["ai-maintainer"]

# The floor the README states, and the version .python-version pins, which is
# the only one the gate runs. A floor below that is a claim nothing checks:
# ruff holds the syntax it knows about to the target, but a stdlib call added
# after it still imports clean here and raises on the older interpreter.
target-version = "py312"

[lint]
# Every rule ruff has, then what is given up and why. The version is pinned in
# each gate's manifest, so this set only moves when a commit moves it.
select = ["ALL"]
ignore = [
    # Mandates rather than checks: an annotation on every signature, a docstring
    # on every module and function, a copyright header on every file.
    "ANN",
    "D",
    "CPY",
    # The formatter owns commas and quoting; ruff documents these as conflicting
    # with it.
    "COM",
    # Bans print(). These are command line scripts, where print is the output.
    "T20",
    # Style preferences about call shape and where an exception's message lives.
    "FBT",
    "EM",
    "TRY003",
    "PLR2004",
    # Size and complexity ceilings. Worth watching, not worth failing a build on,
    # and the Go gates here give up the same ones.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    # Mandate a control-flow shape: a return moved into an else, a raise
    # hoisted into its own function.
    "TRY300",
    "TRY301",
]

[lint.per-file-ignores]
# A test asserts, reaches into the unit it covers, writes stubs whose arguments
# exist to match a signature rather than to be read, and names /tmp paths as
# fixture data rather than writing to them.
"**/test_*.py" = ["ARG", "S101", "S108", "SLF001"]
"**/*_test.py" = ["ARG", "S101", "S108", "SLF001"]

# Scoped to the CLI rather than the whole repository: running a subprocess is
# what this tool does; its 163 logging calls format their own message, where the
# lazy formatting G004 asks for buys nothing and rewriting each to %-style
# arguments is 163 chances to mismatch a placeholder; and the errors it handles
# are expected conditions an operator reads as a line, not as a stack.
"ai-maintainer" = ["G004", "S603", "TRY400"]
